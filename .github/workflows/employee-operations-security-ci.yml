name: Employee Operations Security & Ephemeral Database CI

on:
  push:
    branches:
      - 'feature/employee-operations-system'
      - 'main'
  pull_request:
    branches:
      - 'feature/employee-operations-system'
      - 'main'

jobs:
  ephemeral-db-and-security-gate:
    name: Ephemeral Database & Security Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Deno Runtime for Edge Function Tests
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Install Node Dependencies
        run: npm ci

      - name: Setup Pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.15.5

      - name: Start Ephemeral Local Supabase Stack
        run: supabase start

      - name: Reset Database & Apply All Migrations Cleanly
        run: supabase db reset

      - name: Run Ephemeral Database Behavioral Security Tests (pgTAP)
        run: supabase test db

      - name: Run Edge Function Deno Test Suite
        run: deno test --allow-net --allow-env supabase/functions/attendance-automation/index.test.ts

      - name: Run Linter (oxlint)
        run: npx oxlint .

      - name: Verify Clean Git Working Tree (diff-check)
        run: git diff --check

      - name: Run Full Vitest Test Suite (Unit & Edge Specs)
        run: npm test -- --run

      - name: Run Production TypeScript & Vite Build
        run: npm run build

      - name: Stop Ephemeral Supabase Stack
        if: always()
        run: supabase stop --no-backup
