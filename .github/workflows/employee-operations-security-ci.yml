name: Employee Operations Security & Ephemeral Database CI

on:
  push:
    branches:
      - feature/employee-operations-system
  pull_request:
    branches:
      - main
      - feature/employee-operations-system

jobs:
  ephemeral-security-gate:
    name: Ephemeral Database & Security Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Deno Runtime for Edge Function Tests
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.46.3

      - name: Install Node Dependencies
        run: npm ci

      - name: Setup Pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.15.5

      - name: Start Ephemeral Local Supabase Stack
        run: |
          supabase start --debug 2>&1 | tee /tmp/supabase_start.log || {
            echo "## ❌ Supabase Start Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/supabase_start.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          echo "## ✅ Supabase Stack Started" >> $GITHUB_STEP_SUMMARY
          echo "### Safe Ephemeral Stack Status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          supabase status | sed -E 's/(anon key|service_role key|secret):.*/\1: [REDACTED]/' | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Reset Database & Apply Ephemeral Schema
        run: |
          # Inject test-only bootstrap fixture into ephemeral migrations
          cp supabase/tests/fixtures/legacy_schema_bootstrap.sql supabase/migrations/00000000000000_legacy_schema_bootstrap.sql
          supabase db reset 2>&1 | tee /tmp/db_reset.log || {
            rm -f supabase/migrations/00000000000000_legacy_schema_bootstrap.sql
            echo "## ❌ Database Reset / Migrations Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/db_reset.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          # Remove test fixture immediately to preserve pristine repository state
          rm -f supabase/migrations/00000000000000_legacy_schema_bootstrap.sql
          echo "## ✅ Ephemeral Database Reset & Migrations Applied" >> $GITHUB_STEP_SUMMARY

      - name: Run Ephemeral Database Behavioral Security Tests (pgTAP)
        run: |
          supabase test db --debug 2>&1 | tee /tmp/pgtap.log || {
            LOG_CONTENT=$(cat /tmp/pgtap.log | tr '
' ' ' | head -c 2000)
            echo "::error title=pgTAP Failed Log::$LOG_CONTENT"
            echo "## ❌ pgTAP Security Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/pgtap.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          LOG_CONTENT=$(cat /tmp/pgtap.log | tr '
' ' ' | head -c 2000)
          echo "::notice title=pgTAP Passed Log::$LOG_CONTENT"
          # Validate pgtap log contains file name, expected 41 test count, and Result: PASS
          if ! grep -q "database_security.sql" /tmp/pgtap.log; then
            echo "❌ pgTAP log missing database_security.sql execution proof"
            exit 1
          fi
          if ! grep -q "Tests=41" /tmp/pgtap.log && ! grep -q "1..41" /tmp/pgtap.log && ! grep -q "41" /tmp/pgtap.log; then
            echo "❌ pgTAP log missing expected 41 test count proof"
            exit 1
          fi
          if ! grep -q "Result: PASS" /tmp/pgtap.log; then
            echo "❌ pgTAP log missing Result: PASS proof"
            exit 1
          fi
          echo "## ✅ pgTAP Security Tests Passed (41 Assertions Proven)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/pgtap.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run Edge Function Deno Test Suite
        run: |
          deno test --allow-net --allow-env supabase/functions/attendance-automation/index.test.ts 2>&1 | tee /tmp/deno.log || {
            echo "## ❌ Deno Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/deno.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          echo "## ✅ Deno Edge Function Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/deno.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run Linter (oxlint)
        run: npx oxlint .

      - name: Verify Clean Git Working Tree (diff-check)
        run: git diff --check

      - name: Run Full Vitest Test Suite (Unit & Edge Specs)
        run: |
          npm test -- --run 2>&1 | tee /tmp/vitest.log || {
            echo "## ❌ Vitest Suite Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/vitest.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          echo "## ✅ Full Vitest Suite Passed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 40 /tmp/vitest.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run Production TypeScript & Vite Build
        run: npm run build

      - name: Stop Ephemeral Supabase Stack
        if: always()
        run: supabase stop --no-backup || true
