# Supabase Project Configuration for Ops Hub V2
project_id = "ops-hub-v2"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.manage-team-member]
verify_jwt = true

[functions.manage-client-task]
verify_jwt = true

[functions.manage-archive]
verify_jwt = true

[functions.manage-profile]
verify_jwt = true

[functions.manage-task-template]
verify_jwt = true

[functions.attendance-automation]
verify_jwt = false
